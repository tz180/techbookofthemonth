name: Unpack images

on:
  push:
    paths:
      - assets-pack.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack images into assets folder
        run: |
          if [ ! -f assets-pack.zip ]; then echo "pack already unpacked"; exit 0; fi
          mkdir -p assets
          unzip -o assets-pack.zip -d assets
          rm -f assets-pack.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack site images into assets/"
          git push
